version: "3.9"

services:
  flawless-take:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flawless-take-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CONFLUENT_BOOTSTRAP_SERVERS=${CONFLUENT_BOOTSTRAP_SERVERS:-}
      - CONFLUENT_API_KEY=${CONFLUENT_API_KEY:-}
      - CONFLUENT_API_SECRET=${CONFLUENT_API_SECRET:-}
      - CONFLUENT_TOPIC=${CONFLUENT_TOPIC:-flawless-take-events}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - uploads-data:/app/backend/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads-data:
    name: flawless-take-uploads
